<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Owner Dashboard — Kruger Marloth Bookings</title>
<meta name="theme-color" content="#1c2e1c" />
<link rel="icon" href="logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css?v=20261027e" />
</head>
<body>

<!-- Sign-in / setup -->
<div class="auth hidden" id="auth"></div>

<!-- Dashboard -->
<div class="shell hidden" id="shell">
  <aside class="side">
    <div class="side-brand">
      <img src="logo.jpg" alt="" />
      <div><strong>Kruger Marloth</strong><small>Bookings dashboard</small></div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="sync" id="syncSide"><span class="dot"></span><span class="txt"></span></div>
      <a href="index.html" target="_blank" rel="noopener" id="viewSite"></a>
      <button id="signOutSide"></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <img src="logo.jpg" alt="" />
      <strong>Bookings</strong>
      <div class="sync" id="syncTop"><span class="dot"></span><span class="txt"></span></div>
    </div>
    <div class="view" id="view"></div>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
<div id="confirmRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data.js?v=20261027e"></script>
<script src="assets/js/common.js?v=20261027e"></script>
<script src="assets/js/admin.js?v=20261027e"></script>
</body>
</html>
